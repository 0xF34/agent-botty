<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Botty</title><style>body{margin:0;font-family:Inter,system-ui;background:#0b0d12;color:#eef2ff}main{display:grid;grid-template-columns:260px 1fr;height:100vh}.side{border-right:1px solid #222938;padding:20px}.brand{font-size:20px;font-weight:800}.muted{color:#8e98aa;font-size:13px}button,input,textarea,select{font:inherit}.new,button{background:#6d5dfc;color:white;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.workspace{display:flex;flex-direction:column}.top{padding:18px 24px;border-bottom:1px solid #222938;display:flex;justify-content:space-between}.feed{flex:1;overflow:auto;padding:24px;max-width:900px;width:100%;box-sizing:border-box;margin:auto}.card{background:#121722;border:1px solid #222938;border-radius:14px;padding:16px;margin:12px 0;white-space:pre-wrap}.user{border-color:#4f46e5}.composer{padding:18px 24px;border-top:1px solid #222938;display:flex;gap:10px}.composer textarea{flex:1;resize:none;background:#121722;color:white;border:1px solid #30394b;border-radius:12px;padding:12px;min-height:48px}.status{font-size:12px;color:#8e98aa}.setting{margin-top:24px}.setting input{width:100%;box-sizing:border-box;background:#121722;border:1px solid #30394b;color:white;padding:9px;border-radius:8px}</style></head><body><main><aside class="side"><div class="brand">🤖 Agent Botty</div><p class="muted">Manus-powered workspace</p><button class="new" onclick="newTask()">+ New task</button><div class="setting"><div class="muted">Agent profile</div><select id="profile"><option>manus-1.6</option><option>manus-1.6-lite</option><option>manus-1.6-max</option></select></div><div class="setting"><div class="muted">Workspace</div><input id="project" placeholder="Project ID (optional)"></div></aside><section class="workspace"><header class="top"><div><b id="title">New workspace</b><div class="status" id="status">Ready</div></div><button onclick="refreshTask()">Refresh</button></header><div class="feed" id="feed"><div class="card">Start by describing a task. Agent Botty creates a Manus task and keeps its ID in this workspace.</div></div><div class="composer"><textarea id="prompt" placeholder="What should the agent do?"></textarea><button onclick="send()">Send</button></div></section></main><script>let taskId=localStorage.taskId||"";let taskTitle=localStorage.taskTitle||"";const feed=document.querySelector("#feed"),status=document.querySelector("#status"),title=document.querySelector("#title");if(taskId){title.textContent=taskTitle||"Active task";status.textContent="Task connected"}function card(text,cls=""){const x=document.createElement("div");x.className="card "+cls;x.textContent=text;feed.appendChild(x);feed.scrollTop=feed.scrollHeight}function newTask(){taskId="";taskTitle="";localStorage.removeItem("taskId");feed.innerHTML="";title.textContent="New workspace";status.textContent="Ready"}async function send(){const p=document.querySelector("#prompt");const text=p.value.trim();if(!text)return;p.value="";card(text,"user");status.textContent="Working…";try{let r;if(!taskId){r=await fetch("/api/tasks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text,project_id:document.querySelector("#project").value||undefined,agent_profile:document.querySelector("#profile").value})})}else{r=await fetch("/api/tasks/"+taskId+"/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})})}const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||"Request failed");if(d.task_id){taskId=d.task_id;taskTitle=d.task_title||"Active task";localStorage.taskId=taskId;localStorage.taskTitle=taskTitle;title.textContent=taskTitle;card("Task started: "+taskId)}status.textContent="Sent — refresh to view agent progress"}catch(e){card("Error: "+e.message);status.textContent="Error"}}async function refreshTask(){if(!taskId)return;status.textContent="Refreshing…";try{const r=await fetch("/api/tasks/"+taskId+"/messages");const d=await r.json();card(JSON.stringify(d,null,2));status.textContent="Updated"}catch(e){card("Error: "+e.message);status.textContent="Error"}}</script></body></html>
